<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex, nofollow" />
		<title>{{ shared.title }} · 知识库</title>
		<meta name="description" content="{{ shared.description }}" />
		<style>
			:root {
				--ink: #3c4450;
				--ink-strong: #3d3a3f;
				--ink-muted: #62748e;
				--border: #e2e8f0;
				--accent: #0c60d9;
				--surface: #ffffff;
				--surface-raised: #f7f9fc;
			}
			* { box-sizing: border-box; }
			body {
				margin: 0;
				background: var(--surface-raised);
				color: var(--ink);
				font: 16px/1.7 "Inter", "Noto Sans SC", -apple-system, "Segoe UI", sans-serif;
				-webkit-font-smoothing: antialiased;
			}
			header {
				border-bottom: 1px solid var(--border);
				background: var(--surface);
			}
			.bar {
				max-width: 860px;
				margin: 0 auto;
				padding: 14px 24px;
				display: flex;
				align-items: center;
				gap: 10px;
				color: var(--ink-muted);
				font-size: 13px;
			}
			.mark {
				width: 26px; height: 26px; border-radius: 7px;
				display: inline-flex; align-items: center; justify-content: center;
				background: linear-gradient(135deg, #0c60d9, #4a7aff);
				color: #fff; font-weight: 700; font-size: 13px;
			}
			main {
				max-width: 860px;
				margin: 24px auto 64px;
				background: var(--surface);
				border: 1px solid var(--border);
				border-radius: 12px;
				padding: 40px 48px 56px;
			}
			h1 { margin: 0 0 6px; font-size: 30px; line-height: 1.25; letter-spacing: -0.01em; color: var(--ink-strong); }
			.meta { margin-bottom: 28px; color: var(--ink-muted); font-size: 13px; }
			article h2 { margin-top: 36px; font-size: 22px; letter-spacing: -0.01em; }
			article h3 { margin-top: 28px; font-size: 18px; }
			article p { margin: 14px 0; }
			article a { color: var(--accent); text-decoration: none; }
			article a:hover { text-decoration: underline; }
			article code {
				padding: 2px 6px; border-radius: 5px;
				background: rgba(8, 8, 8, 0.05);
				font: 0.875em/1.5 "JetBrains Mono", ui-monospace, monospace;
			}
			article pre {
				overflow: auto; padding: 16px 18px; border-radius: 10px;
				background: #292d3e; color: #e6e6e6;
			}
			article pre code { background: none; padding: 0; color: inherit; }
			article blockquote {
				margin: 18px 0; padding: 2px 18px;
				border-left: 3px solid var(--border); color: var(--ink-muted);
			}
			article img { max-width: 100%; border-radius: 8px; }
			article table { width: 100%; border-collapse: collapse; margin: 18px 0; }
			article th, article td { padding: 8px 12px; border: 1px solid var(--border); text-align: left; }
			footer { max-width: 860px; margin: 0 auto 40px; padding: 0 24px; color: var(--ink-muted); font-size: 13px; }
			.skip-link {
				position: absolute; left: -9999px; top: 0;
				background: var(--accent); color: #fff; padding: 8px 16px; z-index: 100;
				border-radius: 0 0 8px 0;
			}
			.skip-link:focus { left: 0; }
			@media (max-width: 640px) {
				main { margin: 12px; padding: 24px 20px 32px; border-radius: 10px; }
				h1 { font-size: 24px; }
			}
		</style>
	</head>
	<body>
		<a class="skip-link" href="#main">跳到内容</a>
		<header>
			<div class="bar">
				<span class="mark" aria-hidden="true">K</span>
				<span>知识库 · 共享页面</span>
			</div>
		</header>
		<main id="main">
			<h1>{{ shared.title }}</h1>
			<p class="meta">最后更新：{{ shared.modified }}</p>
			<article>{{ shared.html | safe }}</article>
		</main>
		<footer>此页面通过分享链接访问，内容归发布者所有。</footer>
	</body>
</html>
